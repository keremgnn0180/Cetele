name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Repoyu indir
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Paketleri yükle
        run: npm install

      - name: Build
        run: npm run build -- --publish never

      - name: ESLint
        run: npm run lint

      - name: Testler
        run: npm test